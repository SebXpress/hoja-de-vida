
services:
  postgres:
    image: postgres:16
    container_name: hoja-de-vida-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_dev_2026
      POSTGRES_DB: hoja_de_vida
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d hoja_de_vida"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
